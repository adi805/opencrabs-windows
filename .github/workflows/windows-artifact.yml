name: Windows binary (artifact)

# Why this file exists: ci.yml's `windows-build` job proves a Windows binary
# COMPILES and STARTS, then throws it away - it never uploads the artifact. So
# nothing produced by this series could actually be run on a Windows machine by
# a human. This is the missing hand-off step: same target, same profile, same
# flags, same toolchain, plus upload-artifact.
#
# It is deliberately a NEW file rather than a step added to ci.yml: ci.yml is
# being edited by the other open PRs in this series, and a new path cannot
# conflict with them or restart their in-flight runs.

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-artifact, feat/windows-desktop]

jobs:
  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    # Same ceiling as ci.yml's windows-build: a COLD run needs ~48 min (33
    # compile incl. llama's cmake C++ plus ~15 for the thin-LTO link), warm
    # from rust-cache lands near 10.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # The two tools ci.yml's windows-build also installs: aws-lc-rs needs
      # NASM on Windows, llama-cpp-sys-2 drives CMake.
      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # latest
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build (flags identical to ci.yml windows-build)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: cargo build --locked --profile ci --target x86_64-pc-windows-msvc --all-features

      - name: Smoke (execute it before shipping it)
        shell: bash
        run: |
          # Actions bash runs with -e: guard the substitution so a failing exe
          # still prints its stderr instead of dying silently (#1759 shape).
          set +e
          ver=$(./target/x86_64-pc-windows-msvc/ci/opencrabs.exe --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

      - name: Upload the exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencrabs-windows-x64
          path: target/x86_64-pc-windows-msvc/ci/opencrabs.exe
          if-no-files-found: error
          retention-days: 30

      # The gap this series was opened to close: nothing in the repo could show
      # what the TUI actually renders on Windows. These tests drive the real
      # `render` / `switch_mode` / `open_usage_dashboard` path into ratatui's
      # TestBackend - no desktop, no screen-scraping, no Wine emulation - and
      # write one frame per screen to target/ui-dump as a character grid plus
      # run-length style runs. They are #[ignore]d, so they must be asked for
      # explicitly, and they run only after the exe has already been proven to
      # start.
      - name: Dump the real UI (one frame per screen)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib ui_snapshot_dump -- --ignored --nocapture
          status=$?
          set -e
          echo "ui-dump exit=$status"
          ls -la target/ui-dump || echo "no target/ui-dump produced"
          # Same gate as the capture step below, and for the same reason: this job
          # is the evidence that the Windows renderer ran, and a filter that
          # matches no test exits 0. Count the frames, do not trust the exit code.
          frames=$(find target/ui-dump -type f -name '*.txt' 2>/dev/null | wc -l)
          echo "ui-dump frames=$frames"
          if [ "$frames" -eq 0 ]; then
            echo "::error::the UI dump produced no frame files (test exit $status); refusing to hand back an empty artifact"
            exit 1
          fi
          exit $status

      - name: Upload the UI dump
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencrabs-ui-dump
          path: target/ui-dump
          if-no-files-found: error
          retention-days: 30

      # The other half of the same gap, and the one the UI dump cannot close: a
      # render dump is the app's own buffer, not a photograph of a window on a
      # desktop. This asks the OS to paint a window and reads the pixels back, so
      # the artifact is what the window manager actually drew.
      #
      # It opens its own console window (CREATE_NEW_CONSOLE) rather than
      # photographing whatever is on screen: a window the test owns carries known
      # text, so "ink > 0" is a statement about the capture path instead of about
      # the runner's wallpaper. The test measures the ink ratio of every frame and
      # FAILS on a blank one, which is the whole point - PrintWindow returns TRUE
      # for windows it did not paint.
      #
      # It asserts an interactive seat, because a hosted runner was measured to
      # have one (SessionId 2, UserInteractive True) and a silent empty directory
      # would be indistinguishable from a broken capture.
      - name: Capture a real window to PNG
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib capture_dump -- --ignored --nocapture
          status=$?
          set -e
          echo "capture-dump test exit=$status"
          ls -la target/capture-dump 2>/dev/null || echo "no target/capture-dump directory"
          # An outcome gate, deliberately separate from the test's exit code. The
          # claim this job has to support is "a PNG was photographed", and a green
          # run that wrote nothing is the failure this module keeps meeting: an
          # `--ignored` filter that matches no real test exits 0, cargo prints "ok"
          # for it, and the upload step at most warns. Count the files instead.
          frames=$(find target/capture-dump -type f -name '*.png' 2>/dev/null | wc -l)
          echo "capture-dump frames=$frames"
          if [ "$frames" -eq 0 ]; then
            echo "::error::the capture dump produced no PNG (test exit $status); refusing to hand back an empty artifact"
            exit 1
          fi
          exit $status

      - name: Upload the window captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencrabs-windows-captures
          path: target/capture-dump
          if-no-files-found: error
          retention-days: 30

      - name: Drive a real window (injected and posted input)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          # --test-threads=1 is not a style choice. These jobs share two pieces of
          # machine-global state: which window holds focus, and where the pointer
          # is. Run concurrently, one job's injected click moves the pointer that
          # another job is asserting was left alone, and a spawned console steals
          # focus from the one about to be typed into -- which that test is
          # written to refuse, so it would fail for a reason that is the runner's
          # fault and not the code's.
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib input_dump -- --ignored --nocapture --test-threads=1
          status=$?
          set -e
          echo "input-dump test exit=$status"
          ls -la target/input-dump 2>/dev/null || echo "no target/input-dump directory"
          # Same outcome gate as the capture step, same reason: the claim here is
          # "a keystroke visibly changed a captured frame", and that claim needs
          # the before/after pair on disk to be checkable by anyone. A filter that
          # matches nothing exits 0 and prints ok.
          frames=$(find target/input-dump -type f -name '*.png' 2>/dev/null | wc -l)
          echo "input-dump frames=$frames"
          if [ "$frames" -lt 2 ]; then
            echo "::error::the input dump wrote fewer than 2 PNGs (frames=$frames, test exit $status): no before/after pair, so the keystroke claim is unverified"
            exit 1
          fi
          exit $status

      - name: Upload the input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencrabs-windows-input
          path: target/input-dump
          if-no-files-found: error
          retention-days: 30

      - name: Drive the app lane (launch, focus, close)
        # `always()` on purpose: this is the only place the three app actions are
        # exercised against a real window, and it is most worth running on a
        # commit whose input step just went red.
        if: always()
        run: cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features --lib app_dump -- --ignored --nocapture --test-threads=1
        shell: bash

      - name: Count the app evidence
        # Windows runners default this step to PowerShell; the gate below is
        # POSIX. Without an explicit shell the count dies with a ParserError
        # even when the frames are on disk and the receipt is real.
        shell: bash
        if: always()
        run: |
          status=0
          ls -la target/input-dump 2>/dev/null || echo "no target/input-dump directory"
          # Same gate as the input and capture steps, same reason: the claim is
          # "a launched program showed a window, took the foreground, and then
          # stopped being one", and that claim is only checkable if the frames it
          # was measured against are on disk. A filter that matches nothing exits
          # 0 and prints ok, so the count is the test, not the exit code.
          frames=$(find target/input-dump -type f -name 'app-*.png' 2>/dev/null | wc -l)
          echo "app-dump frames=$frames"
          if [ "$frames" -lt 2 ]; then
            echo "::error::the app dump wrote fewer than 2 app-*.png (frames=$frames): no launched-window and focused-window frame, so the app-control claim is unverified"
            exit 1
          fi
          exit $status

      - name: Upload the app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencrabs-windows-app
          path: target/input-dump/app-*.png
          if-no-files-found: error
          retention-days: 30

  # The render dump proves what the app writes into the terminal buffer. It does
  # not prove what a user sees in a window. A probe run (PR#14) settled the open
  # question with receipts: a hosted Windows runner really does have a desktop
  # session (SessionId 2, UserInteractive True, 1024x768 virtual screen), and a
  # console window it launched came back from the capture with legible text
  # ("PROBE_MARKER_12345", "Waiting for 51 seconds"). So photographs are
  # possible here without anybody's PC, and this job takes them: it runs the exe
  # we just built in a visible console sized to the app's own request, drives it
  # with real keystrokes, and shoots the screen after each step.
  #
  # Deliberately fail-soft. Whatever the app happens to show is the finding; an
  # empty capture is still a frame to read, so the job must not go red before the
  # images are uploaded.
  desktop-capture:
    name: Photograph the app on a real Windows desktop
    needs: windows-exe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the exe this run built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opencrabs-windows-x64
          path: app

      - name: Launch it in a console window and shoot every step
        # Not continue-on-error: a frame showing the wrong screen is a finding
        # to read, but zero frames means the harness failed, and the script
        # exits non-zero for exactly that case so a silent empty artifact
        # cannot pass as a successful capture.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $shots = Join-Path $PWD 'shots'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $exe = (Resolve-Path (Join-Path $PWD 'app\opencrabs.exe')).Path
          "exe: $exe"

          # The window is found by title, so the capture cannot silently shoot
          # some other process's window.
          $sig = @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class U {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp

          function FindTarget {
            Get-Process | Where-Object { $_.MainWindowTitle -like '*OCAP*' } |
              Select-Object -First 1
          }

          # SetForegroundWindow is allowed to fail and says so only through its
          # return value, which the old code threw away with [void]. A keystroke
          # or a whole-screen copy aimed at the wrong window still looks like
          # success, so ask, then VERIFY the foreground handle is the target
          # before anything is typed or shot.
          function Focus([System.Diagnostics.Process]$t) {
            for ($try = 1; $try -le 5; $try++) {
              if ([U]::GetForegroundWindow() -eq $t.MainWindowHandle) { return $true }
              [void][U]::SetForegroundWindow($t.MainWindowHandle)
              Start-Sleep -Milliseconds 400
            }
            # Write-Host, not the pipeline: a bare string would join $false in
            # the return value, and `-not @("msg", $false)` is $false, so the
            # caller's guard would never fire on a real focus failure.
            Write-Host "  focus FAILED: wanted $($t.MainWindowHandle), foreground is $([U]::GetForegroundWindow())"
            return $false
          }

          function Shoot([string]$tag) {
            $t = FindTarget
            if ($null -eq $t) { "  $tag : no OCAP window found, skipped"; return }
            if (-not (Focus $t)) { "  $tag : skipped, the target never held the foreground"; return }
            Start-Sleep -Milliseconds 500
            $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
            try {
              $bmp = New-Object System.Drawing.Bitmap($vs.Width, $vs.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($vs.X, $vs.Y, 0, 0, $bmp.Size)
              $file = Join-Path $shots "$tag.png"
              $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              "  $tag : $((Get-Item $file).Length) bytes (fg=$([U]::GetForegroundWindow()), title='$($t.MainWindowTitle)')"
            } catch { "  $tag : capture FAILED $($_.Exception.Message)" }
          }

          function Send([string]$keys) {
            $t = FindTarget
            if ($null -eq $t) { "  no window, key dropped: $keys"; return }
            if (-not (Focus $t)) { "  no foreground, key dropped: $keys"; return }
            Start-Sleep -Milliseconds 300
            try { [System.Windows.Forms.SendKeys]::SendWait($keys) }
            catch { "  send FAILED $($_.Exception.Message)" }
            Start-Sleep -Milliseconds 900
          }

          # mode con sizes the buffer BEFORE the app starts, which is the one
          # thing Wine could not do and the reason its frames were garbage. The
          # buffer is measured against the screen the runner actually has: a
          # fixed 150x45 is about 1200px wide at conhost's 8x16 raster font, so
          # on a 1024px screen the window ran off the right edge and every
          # whole-screen capture cropped the app. Leave a little room for the
          # window chrome.
          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $cols = [Math]::Max(80, [Math]::Min(150, [int]($vs.Width / 8) - 2))
          $lines = [Math]::Max(25, [Math]::Min(50, [int]($vs.Height / 16) - 3))
          "console buffer: ${cols}x${lines} on a $($vs.Width)x$($vs.Height) screen"

          function Start-App {
            $proc = Start-Process cmd.exe -ArgumentList '/K', "title OCAP && mode con cols=$cols lines=$lines && `"$exe`"" -PassThru
            Start-Sleep -Seconds 9
            # Write-Host: anything on the pipeline would join the returned
            # process object and make $p an array.
            Write-Host "started pid=$($proc.Id)"
            return $proc
          }

          function Stop-App([System.Diagnostics.Process]$proc) {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } catch { Write-Host "stop: $($_.Exception.Message)" }
            Get-Process opencrabs -ErrorAction SilentlyContinue | ForEach-Object {
              try { Stop-Process -Id $_.Id -Force } catch { Write-Host "child stop failed" }
            }
            Start-Sleep -Seconds 3
          }

          # Phase 1: a fresh install. No onboarding record exists yet, so the
          # wizard runs; Enter walks it and every press is a frame.
          $p = Start-App
          Shoot "00-boot"
          for ($i = 1; $i -le 8; $i++) {
            $tag = "{0:d2}-wizard-{1:d}" -f (1 + $i), $i
            Send "{ENTER}"
            Shoot $tag
          }
          Stop-App $p

          # Phase 2: the chat menus. The wizard cannot be driven into the chat
          # by keystrokes alone: its provider step wants an API key this job has
          # no reason to hold, so eight Enters stop there and the later slashes
          # land in the path field, leaving the menu frames showing a screen
          # that never reaches the menus. Whether onboarding finished is a
          # recorded fact, not an inference, so record it: the runner's home is
          # disposable, and the app then opens straight into chat, where ESC
          # plus a slash command renders each menu.
          $ocHome = Join-Path $env:USERPROFILE '.opencrabs'
          New-Item -ItemType Directory -Force -Path $ocHome | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $ocHome 'onboarding.json'),
            '{"completed":true}',
            (New-Object System.Text.UTF8Encoding($false)))   # no BOM: serde_json would reject it

          $p = Start-App
          Shoot "10-chat-boot"
          $menus = @('help', 'menu', 'status', 'usage', 'sessions', 'profiles',
                     'providers', 'models', 'health', 'audit')
          $n = 10
          foreach ($m in $menus) {
            $n++
            Send "{ESC}"
            Send "/$m{ENTER}"
            Shoot ("{0:d2}-menu-{1}" -f $n, $m)
          }
          Stop-App $p

          $frames = (Get-ChildItem $shots -Filter *.png | Measure-Object).Count
          "frames: $frames"
          Get-ChildItem $shots -Filter *.png | ForEach-Object { "  $($_.Name) $($_.Length)" }
          # A frame that shows the wrong screen is still a finding to read, so
          # the step stays soft about CONTENT. Zero frames is not a finding: the
          # harness itself failed, and reporting success there is the false
          # green this guard exists to stop.
          if ($frames -eq 0) {
            "no frame was captured at all: the harness failed, not the app"
            exit 1
          }

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencrabs-windows-desktop
          path: shots
          if-no-files-found: error
          retention-days: 30
