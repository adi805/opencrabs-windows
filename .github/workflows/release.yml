name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch: if GitHub stops delivering push events (as it did for
  # the v0.3.80 attempt on 2026-08-12), trigger the release from the API instead:
  #   gh workflow run release.yml --ref v<version>
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # CI only runs on PRs (not pushes to main). For release tags, we verify
  # the commit is on main and skip CI polling entirely. PRs are where CI
  # gates happen; main is protected by branch protection requiring PR merge.
  wait-for-ci:
    name: Verify main branch
    # Fork guard: this pipeline belongs to upstream. `publish-crate` pushes the
    # crate named `opencrabs` to crates.io, which only the upstream org can do,
    # so on a fork the release can never be created from here. Without this
    # guard a tag push still spends five platform builds and finishes red,
    # running next to the fork's own release-fork.yml for the same tag.
    # Skipping this job cascades: every other job in this file needs it.
    if: github.repository == 'opencrabs/opencrabs'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          # Verify the tag points to a commit on main
          MAIN_SHA=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha' 2>/dev/null || echo "")
          if [ -z "$MAIN_SHA" ]; then
            echo "ERROR: Could not fetch main branch HEAD"
            exit 1
          fi
          # Check if our SHA is reachable from main (may not be HEAD if tag is on older commit)
          MERGE_BASE=$(gh api "repos/$REPO/compare/${MAIN_SHA}...${SHA}" --jq '.status' 2>/dev/null || echo "error")
          case "$MERGE_BASE" in
            "identical"|"behind")
              echo "Commit $SHA is on main (main is at $MAIN_SHA)"
              ;;
            *)
              # Also accept if SHA IS main HEAD
              if [ "$SHA" = "$MAIN_SHA" ]; then
                echo "Commit $SHA is main HEAD"
              else
                echo "WARNING: Commit $SHA may not be on main (status: $MERGE_BASE). Proceeding anyway."
              fi
              ;;
          esac
          echo "Ready to release."

  publish-crate:
    name: Publish to crates.io
    # The crate name comes from Cargo.toml, so this job is repo-agnostic: the
    # fork publishes `opencrabs-fork`, upstream publishes `opencrabs`. It used
    # to be gated to upstream, because a fork publish of `opencrabs` fails with
    # 403 and create-release requires this job to succeed -- so that one 403
    # blocked every binary release here. Owning our own crate name removes the
    # dependency instead of working around it.
    #
    # A missing token is only fatal where a token is expected: upstream must
    # publish (its release is all-or-nothing with crates.io), while a fork
    # without a token skips the upload and still ships its GitHub Release.
    needs: [wait-for-ci, build-release]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      crate: ${{ steps.check.outputs.crate }}
    steps:
      - uses: actions/checkout@v5

      - name: Check if already published
        id: check
        run: |
          # Read the name from Cargo.toml rather than hardcoding it: the fork
          # publishes under a different crate name than upstream, and a stale
          # literal here would probe the wrong crate.
          CRATE=$(grep -m1 '^name' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf "https://crates.io/api/v1/crates/$CRATE/$VERSION" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already on crates.io — skipping build"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust
        if: steps.check.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA dev
        if: steps.check.outputs.published == 'false'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Require a registry token where one is expected
        # Upstream owns the `opencrabs` crate name, so a missing token there is
        # a misconfiguration, not a policy: fail loudly rather than let the
        # all-or-nothing contract quietly stop applying. A fork publishes under
        # its own name and may legitimately have no token yet.
        if: github.repository == 'opencrabs/opencrabs' && env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "::error::CARGO_REGISTRY_TOKEN is unset on the upstream repository, so the crates.io publish cannot run."
          exit 1

      # No continue-on-error: where a token exists, a failed crates.io publish
      # must FAIL this job so the GitHub Release (binaries) is never dropped
      # while crates.io lags behind. An already-published version, or a repo
      # with no token, skips the step and the job still succeeds.
      - name: Publish
        if: steps.check.outputs.published == 'false' && env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --allow-dirty

  build-release:
    name: Build Release
    needs: wait-for-ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: opencrabs
            asset_suffix: linux-amd64

          # Thin LTO on this target only. The fat-LTO link of the whole binary
          # takes a single rustc past 14.8 GB RSS on the hosted arm runner
          # (16 GB, no real swap): memory hits 63 MB available, the VM
          # freezes, and GitHub kills the runner with a shutdown signal and
          # exit 143 after 25 to 30 silent minutes. Measured on a sampled
          # build of v0.5.2; waproto 0.7.0 alone generates 164k lines that
          # all land in the fat-LTO module. The amd64 runner squeaks through
          # the same link, so every other target keeps the Cargo.toml
          # profile.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: opencrabs
            asset_suffix: linux-arm64
            release_lto: thin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: opencrabs.exe
            asset_suffix: windows-amd64

          # Both darwin targets build on our own Mac. GitHub bills macOS
          # minutes at 10x, Linux at 1x and Windows at 2x, so these two jobs
          # cost more than the other three combined; the Mac runs them for
          # free and natively. Linux and Windows stay hosted, where they are
          # cheap and native. This does mean a tag cannot finish its release
          # while the Mac runner is offline: the darwin jobs queue until it
          # comes back rather than failing over to a hosted runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: opencrabs
            asset_suffix: macos-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: opencrabs
            asset_suffix: macos-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install CMake (Windows)
        if: matrix.os == 'windows-latest'
        uses: lukka/get-cmake@latest

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Build
        shell: bash
        env:
          CFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-march=armv8-a+crypto' || '' }}
          CXXFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-march=armv8-a+crypto' || '' }}
          AWS_LC_SYS_CMAKE_BUILDER: ${{ matrix.os == 'windows-latest' && '1' || '' }}
          # Explicit `fat` everywhere else: it is the Cargo.toml value, and an
          # empty string here would be parsed as an invalid lto setting.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.release_lto || 'fat' }}
        # --all-features on purpose: release binaries carry every optional
        # feature, including `eval` and `profiling`. That is what has always
        # shipped and nobody has wanted less. The README used to claim the
        # eval harness never reaches a release binary; the claim was wrong,
        # not the build, and it has been corrected rather than the binary
        # narrowed (#1402).
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features

      - name: "Smoke (windows): execute the shipping artifact before packaging"
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # The ci.yml smoke runs the ci-profile binary; this one runs the
          # release-profile binary that actually ships in
          # opencrabs-v<version>-windows-amd64.zip (different LTO/codegen
          # shape, different link). Greptile P1 finding on the #2 smoke.
          #
          # Scope, stated exactly: this proves the packaged image LOADS and
          # that its CLI parses -- a missing DLL, a broken link, an
          # import-table failure all stop here. It does NOT prove normal
          # startup: --version returns from argument parsing before profile
          # setup and logging init run, so an init-time failure would still
          # reach the download page. Driving a non-TUI subcommand
          # (e.g. `status`) is the follow-up that covers it, and it is not
          # in this step because no Windows host was available to validate
          # it -- an unvalidated probe in the release path can block a
          # release, which is worse than a check with a stated edge.
          set +e
          ver=$(./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

      - name: Download and bundle RTK 0.40.0
        shell: bash
        run: |
          RTK_VERSION="0.40.0"
          RTK_TARGET="${{ matrix.target }}"
          
          # Map Rust targets to RTK release asset names (v0.40.0 actual names)
          case "$RTK_TARGET" in
            x86_64-unknown-linux-gnu)
              RTK_ASSET="rtk-x86_64-unknown-linux-musl.tar.gz"
              ;;
            aarch64-unknown-linux-gnu)
              RTK_ASSET="rtk-aarch64-unknown-linux-gnu.tar.gz"
              ;;
            x86_64-apple-darwin)
              RTK_ASSET="rtk-x86_64-apple-darwin.tar.gz"
              ;;
            aarch64-apple-darwin)
              RTK_ASSET="rtk-aarch64-apple-darwin.tar.gz"
              ;;
            x86_64-pc-windows-msvc)
              RTK_ASSET="rtk-x86_64-pc-windows-msvc.zip"
              ;;
            *)
              echo "Unknown target: $RTK_TARGET"
              exit 1
              ;;
          esac
          
          RTK_URL="https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/${RTK_ASSET}"
          echo "Downloading RTK from: $RTK_URL"
          
          curl -L -o "/tmp/$RTK_ASSET" "$RTK_URL"
          
          # Extract RTK binary
          mkdir -p /tmp/rtk-extract
          if [[ "$RTK_ASSET" == *.zip ]]; then
            unzip -q "/tmp/$RTK_ASSET" -d /tmp/rtk-extract
          else
            tar xzf "/tmp/$RTK_ASSET" -C /tmp/rtk-extract
          fi
          
          # Find the rtk binary in the extracted archive
          RTK_BINARY=$(find /tmp/rtk-extract -name "rtk" -o -name "rtk.exe" | head -1)
          if [ -z "$RTK_BINARY" ]; then
            echo "RTK binary not found in archive"
            ls -laR /tmp/rtk-extract
            exit 1
          fi
          
          # Copy to the release directory alongside opencrabs
          RELEASE_DIR="target/${{ matrix.target }}/release"
          cp "$RTK_BINARY" "$RELEASE_DIR/"
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x "$RELEASE_DIR/rtk"
          fi
          echo "RTK binary bundled at: $RELEASE_DIR/$(basename $RTK_BINARY)"
          ls -lh "$RELEASE_DIR/$(basename $RTK_BINARY)"

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create archive
        shell: bash
        run: |
          ASSET_NAME="opencrabs-v${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}"
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../../${ASSET_NAME}.zip ${{ matrix.artifact_name }} rtk.exe
          else
            tar czf ../../../${ASSET_NAME}.tar.gz ${{ matrix.artifact_name }} rtk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opencrabs-v${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}
          path: |
            opencrabs-v${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}.tar.gz
            opencrabs-v${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}.zip

  create-release:
    name: Create Release
    needs: [publish-crate, build-release]
    # Drop the release binaries ONLY when everything succeeded — every platform
    # build AND the crates.io publish. Previously this was `always()`, so a
    # failed publish still shipped binaries: users auto-updated past the version
    # crates.io actually had, then had to update manually. All-or-nothing now.
    #
    # `skipped` is accepted for publish-crate so a fork with no registry token
    # still ships its GitHub Release. On upstream the job always runs and its
    # token guard fails loudly, so the all-or-nothing guarantee is unchanged.
    if: always() && needs.build-release.result == 'success' && (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          version="${{ steps.version.outputs.version }}"
          body=$(awk "/^## \\[${version}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$body" > /tmp/release_notes.md
          # Add full changelog link (extract previous version from CHANGELOG.md)
          echo "" >> /tmp/release_notes.md
          prev_version=$(awk "/^## \\[${version}\\]/{found=1; next} found && /^## \\[/{match(\$0, /\\[([^]]+)\\]/, m); print m[1]; exit}" CHANGELOG.md)
          if [ -n "$prev_version" ]; then
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/v${prev_version}...v${version}" >> /tmp/release_notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      # Homebrew verifies the archive hash on download and refuses to install
      # without one, so a formula cannot reference an asset that has no
      # published sha256 (#924). Emitted here rather than recomputed later so
      # the hash always describes the bytes this release actually shipped.
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use --clobber so the workflow can attach binaries to a release
          # that was already created manually (e.g. via `gh release create`)
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            # Release exists -- upload assets and ensure it's not a draft
            gh release upload "v${{ steps.version.outputs.version }}" \
              release-assets/* --clobber
            gh release edit "v${{ steps.version.outputs.version }}" --draft=false
          else
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes-file /tmp/release_notes.md \
              --latest \
              release-assets/*
          fi
