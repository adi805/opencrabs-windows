name: Pre-release Build

# Build downloadable binaries on demand so contributors can test unreleased
# code without waiting for a tagged release.
#
# Deliberately NOT on every push to main. Five targets per commit, on a repo
# that lands many, spends build time continuously to produce artifacts nobody
# asked for. This runs when there is something worth handing out.
#
# macOS targets use the self-hosted Mac Studio runner (fast, native).
# Linux/Windows targets stay on GitHub-hosted runners.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What is in this build (shown in the pre-release body)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS — self-hosted Mac Studio runner (native arm64, Rosetta for x86_64)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.asset_suffix }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_suffix: macos-arm64
          - target: x86_64-apple-darwin
            asset_suffix: macos-amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        env:
          CFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-march=armv8-a+crypto' || '' }}
          CXXFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-march=armv8-a+crypto' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features

      - name: Download RTK
        shell: bash
        run: |
          bash scripts/fetch-rtk.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release"

      - name: Strip
        run: strip target/${{ matrix.target }}/release/opencrabs

      - name: Create archive
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCHIVE="opencrabs-v${VERSION}-pre-${SHA}-${{ matrix.asset_suffix }}"
          cd target/${{ matrix.target }}/release
          tar czf "../../../${ARCHIVE}.tar.gz" opencrabs rtk

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-${{ matrix.asset_suffix }}
          path: opencrabs-v*-pre-*.tar.gz

      # The archive is what a user receives, so validate the archive: extract it
      # and run the binary out of the extraction. Neither leg had ever executed
      # what it published (#151), and an archive that extracts cleanly but holds
      # a binary which cannot start looks the same from the outside as a good
      # one. A failure fails the job, and publish-prerelease needs this job, so
      # a broken archive never reaches the release page.
      - name: "Smoke: the archived binary starts"
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(ls opencrabs-v*-pre-*.tar.gz | head -1)
          echo "archive: $ARCHIVE"
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar xzf "$ARCHIVE" -C /tmp/smoke
          ls -la /tmp/smoke
          test -x /tmp/smoke/opencrabs
          test -x /tmp/smoke/rtk
          # Actions' bash runs with -e: without the guard, a failing binary would
          # die AT the substitution and the echo below would never run, which is
          # exactly the case whose diagnostic we want. stderr rides in too,
          # because dyld failures land there.
          set +e
          ver=$(/tmp/smoke/opencrabs --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

  # ---------------------------------------------------------------------------
  # Linux — GitHub-hosted runners (cross-compile from Mac is fragile for glibc)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features

      - name: Download RTK
        shell: bash
        run: |
          bash scripts/fetch-rtk.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release"

      - name: Strip
        run: strip target/${{ matrix.target }}/release/opencrabs

      - name: Create archive
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCHIVE="opencrabs-v${VERSION}-pre-${SHA}-${{ matrix.asset_suffix }}"
          cd target/${{ matrix.target }}/release
          tar czf "../../../${ARCHIVE}.tar.gz" opencrabs rtk

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-${{ matrix.asset_suffix }}
          path: opencrabs-v*-pre-*.tar.gz

      # See the macOS leg for why this validates the archive rather than the
      # build tree (#151).
      - name: "Smoke: the archived binary starts"
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(ls opencrabs-v*-pre-*.tar.gz | head -1)
          echo "archive: $ARCHIVE"
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar xzf "$ARCHIVE" -C /tmp/smoke
          ls -la /tmp/smoke
          test -x /tmp/smoke/opencrabs
          test -x /tmp/smoke/rtk
          set +e
          ver=$(/tmp/smoke/opencrabs --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

  # ---------------------------------------------------------------------------
  # Windows — GitHub-hosted runner (needs NASM + CMake for aws-lc-rs)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (windows-amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install CMake
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # latest

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --all-features

      - name: Download RTK
        shell: bash
        run: |
          bash scripts/fetch-rtk.sh x86_64-pc-windows-msvc "target/x86_64-pc-windows-msvc/release"

      - name: Create archive
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCHIVE="opencrabs-v${VERSION}-pre-${SHA}-windows-amd64"
          cd target/x86_64-pc-windows-msvc/release
          7z a "../../../${ARCHIVE}.zip" opencrabs.exe rtk.exe

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-windows-amd64
          path: opencrabs-v*-pre-*.zip

      # See the macOS leg for why this validates the archive rather than the
      # build tree. This leg is the one #151 named: it shipped a .zip that
      # nothing had ever started.
      - name: "Smoke: the archived binary starts"
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(ls opencrabs-v*-pre-*.zip | head -1)
          echo "archive: $ARCHIVE"
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          7z x -y "$ARCHIVE" -o/tmp/smoke > /dev/null
          ls -la /tmp/smoke
          test -f /tmp/smoke/opencrabs.exe
          test -f /tmp/smoke/rtk.exe
          # A DLL-load failure lands on stderr and takes the exit code with it,
          # so both are captured and reported before the verdict.
          set +e
          ver=$(/tmp/smoke/opencrabs.exe --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

  # ---------------------------------------------------------------------------
  # Collect all pre-release artifacts into a single downloadable package
  # ---------------------------------------------------------------------------
  publish-prerelease:
    name: Publish Pre-release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      # Needed before the notes step reads Cargo.toml for the version. Without
      # it that grep runs in an empty workspace and fails the job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          cd release-assets && sha256sum -- * > SHA256SUMS
          ls -la

      - name: Generate pre-release notes
        id: notes
        env:
          # Interpolating GitHub context straight into the script is what
          # Semgrep's run-shell-injection rule flags, and `inputs.note` is
          # caller-supplied text. The environment carries the values instead, so
          # the shell never parses them.
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE_NOTE: ${{ inputs.note }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cat > /tmp/prerelease_notes.md << EOF
          ## Pre-release build: v${VERSION}-pre-${SHORT_SHA}

          **On-demand build.** Not a tagged release, for testing only.

          **Commit:** \`${SHORT_SHA}\` on \`${REF_NAME}\` ([view](https://github.com/${REPO}/commit/${COMMIT_SHA}))

          ${RELEASE_NOTE}

          ### What's included
          - 5 platform binaries (linux-amd64, linux-arm64, macos-amd64, macos-arm64, windows-amd64)
          - SHA256 checksums
          - RTK $(grep '^RTK_VERSION=' scripts/fetch-rtk.sh | cut -d'"' -f2) bundled

          ### Install
          Download the archive for your platform, extract, and run \`./opencrabs\`.

          ### Auto-update
          These builds are not available via \`/evolve\` (that pulls tagged releases). To install a pre-release binary manually, download and replace your existing binary.
          EOF

      - name: Update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use a rolling 'nightly' tag — always points to the latest build
          TAG="nightly"
          # Delete old release if it exists (rolling pre-release)
          if gh release view "$TAG" &>/dev/null; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --title "Pre-release (nightly)" \
            --notes-file /tmp/prerelease_notes.md \
            --prerelease \
            release-assets/*
