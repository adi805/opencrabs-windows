name: Diag snapshot loop

# Dispatch-only diagnostic for issue #55.
#
# The lib test suite stalls on `db_pre_migration_snapshot_test` (the four tests
# whose only heavy operation is `VACUUM INTO`) on a fraction of runs. Two
# in-tree attempts to characterise it came back clean: a three-mode run at 4, 1
# and 16 threads produced zero hang markers, and the affected tests each build
# their own `Database` in their own tempdir, so no shared pool is contended.
#
# So the stall is rare, and one run is not a sample. This job gives the same
# module many attempts on a single head, and bounds every attempt with a
# wall-clock timeout so a stall is reported AS a stall instead of burning the
# job cap in silence. Exit 124 from `timeout` is the signal; it is printed with
# the iteration number and the tail of that attempt.
#
# Deliberately NOT a gate: no push or pull_request trigger. A clean sweep is
# also a result, and it is recorded in the run summary either way.

on:
  # Scoped to this diag branch: the job is not a gate, and a
  # dispatch-only workflow cannot be launched by `gh workflow run`
  # until the file exists on the default branch.
  push:
    branches:
      - diag/snapshot-loop
  workflow_dispatch:
    inputs:
      iterations:
        description: How many times to repeat the snapshot module
        required: false
        default: "200"
      timeout_secs:
        description: Wall-clock bound per attempt, in seconds
        required: false
        default: "120"

concurrency:
  group: diag-snapshot-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          key: diag-snapshot-loop

      # The lib links ALSA (voice input), so the build script for alsa-sys needs
      # `alsa.pc`. ci.yml installs this in every job that compiles; the first
      # run of this workflow died at `alsa-sys` for exactly that reason, which
      # is an infra failure and not the stall this job exists to find.
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Build the lib test binary once
        run: cargo test --locked --profile ci --all-features --lib --no-run

      - name: Loop the snapshot module
        env:
          ITERATIONS: ${{ inputs.iterations || '200' }}
          TIMEOUT_SECS: ${{ inputs.timeout_secs || '120' }}
        run: |
          # `set +e` before anything else: Actions runs this step under `bash -e`,
          # and a bound that kills the reporter produces a bare step timeout with
          # no verdict. The 2026-10-06 run died exactly that way at 120s with zero
          # iterations logged. The reporter must outlive the bound.
          set +e
          set -u
          verdict=CLEAN
          done_iters=0
          for i in $(seq 1 "$ITERATIONS"); do
            start=$(date -u +%H:%M:%S)
            # `|| rc=$?` is load-bearing: Actions runs this step under `bash -e`,
            # so a bare `timeout ...` that returns 124 aborts the script before
            # the verdict is printed, and the stall reads as a plain step
            # timeout with no attempt tail. The bound must be able to fire
            # without killing the reporter.
            rc=0
            timeout "$TIMEOUT_SECS" cargo test --locked --profile ci --all-features \
              --lib db_pre_migration_snapshot_test -- --test-threads=4 \
              > /tmp/iter.log 2>&1 || rc=$?
            done_iters=$i
            if [ "$rc" -eq 0 ]; then
              echo "$start iter $i ok"
              continue
            fi
            echo "$start iter $i rc=$rc <-- NOT OK"
            echo "----- tail of attempt $i -----"
            tail -60 /tmp/iter.log
            if [ "$rc" -eq 124 ]; then
              verdict="STALL"
            else
              verdict="FAIL"
            fi
            break
          done

          echo "----- verdict -----"
          echo "iterations_completed=$done_iters"
          echo "per_attempt_timeout_secs=$TIMEOUT_SECS"
          if [ "$verdict" = "CLEAN" ]; then
            echo "RESULT=CLEAN_AFTER_${done_iters}_ITERATIONS"
          else
            echo "RESULT=${verdict}_AT_ITERATION_${done_iters}"
          fi

          # A stall is the thing this job exists to find, so it must not read as
          # a green run. A plain failure is also non-green.
          if [ "$verdict" != "CLEAN" ]; then
            exit 1
          fi
