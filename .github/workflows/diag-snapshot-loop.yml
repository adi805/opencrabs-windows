name: Diag snapshot loop

# Dispatch-only diagnostic for issue #55.
#
# The lib test suite stalls on `db_pre_migration_snapshot_test` (the four tests
# whose only heavy operation is `VACUUM INTO`) on a fraction of runs. Two
# in-tree attempts to characterise it came back clean: a three-mode run at 4, 1
# and 16 threads produced zero hang markers, and the affected tests each build
# their own `Database` in their own tempdir, so no shared pool is contended.
#
# So the stall is rare, and one run is not a sample. This job gives the same
# module many attempts on a single head, and bounds every attempt with a
# wall-clock timeout so a stall is reported AS a stall instead of burning the
# job cap in silence. Exit 124 from `timeout` is the signal; it is printed with
# the iteration number and the tail of that attempt.
#
# Deliberately NOT a gate: no push or pull_request trigger. A clean sweep is
# also a result, and it is recorded in the run summary either way.

on:
  # Scoped to this diag branch: the job is not a gate, and a
  # dispatch-only workflow cannot be launched by `gh workflow run`
  # until the file exists on the default branch.
  push:
    branches:
      - diag/snapshot-loop
  workflow_dispatch:
    inputs:
      iterations:
        description: How many times to repeat the snapshot module
        required: false
        default: "200"
      timeout_secs:
        description: Wall-clock bound per attempt, in seconds
        required: false
        default: "120"

concurrency:
  group: diag-snapshot-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          key: diag-snapshot-loop

      # The lib links ALSA (voice input), so the build script for alsa-sys needs
      # `alsa.pc`. ci.yml installs this in every job that compiles; the first
      # run of this workflow died at `alsa-sys` for exactly that reason, which
      # is an infra failure and not the stall this job exists to find.
      # `gdb` is the point of this step's second package: the 2026-10-06 run
      # captured /proc per-thread state (wchan + kernel stacks) but printed
      # "(gdb not on PATH)", so the userspace frames that name the exact
      # function holding the lock were missing. wchan says `futex_do_wait`,
      # which is contention, not the line that contends.
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev gdb

      # Build once, then hand the binary path to the loop.
      #
      # The loop must NOT call `cargo test` inside its timed region. On the
      # 2026-10-06 run the pre-build reported `Finished ci profile in 25m 15s`
      # and the very next `cargo test` still recompiled the whatsapp crates plus
      # the crate itself, so the 120s bound was consumed by a rebuild and the
      # harness printed `RESULT=STALL_AT_ITERATION_1` with `Compiling opencrabs`
      # in the attempt tail. That verdict was an artefact of the probe, not
      # evidence about the stall (#55). Running the already-built binary keeps
      # cargo out of the timed region entirely.
      - name: Build the lib test binary once
        # `gdb` is only as good as the symbols it can read. `[profile.ci]`
        # inherits `release`, and `release` sets `strip = true`, so a dump
        # from that build returns bare addresses no matter that gdb is
        # installed: `wchan` would still say `futex_do_wait` and the frames
        # that name the lock holder would be missing. Keep line tables and
        # the symbol table for THIS build only. `debug = 1` is Cargo's
        # `line-tables-only`, so the binary stays small enough to attach to.
        env:
          CARGO_PROFILE_CI_DEBUG: "1"
          CARGO_PROFILE_CI_STRIP: "none"
        run: |
          cargo test --locked --profile ci --all-features --lib --no-run > /tmp/build.log 2>&1
          BIN=$(grep -oE 'target/ci/deps/opencrabs-[0-9a-f]+' /tmp/build.log | tail -1)
          if [ ! -x "$BIN" ]; then
            echo "BUILD_BIN_NOT_FOUND (grep found '${BIN:-nothing}')"
            tail -20 /tmp/build.log
            exit 1
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "test binary: $BIN"

      - name: Loop the snapshot module
        env:
          ITERATIONS: ${{ inputs.iterations || '200' }}
          TIMEOUT_SECS: ${{ inputs.timeout_secs || '120' }}
        run: |
          # `set +e` before anything else: Actions runs this step under `bash -e`,
          # and a bound that kills the reporter produces a bare step timeout with
          # no verdict. The 2026-10-06 run died exactly that way at 120s with zero
          # iterations logged. The reporter must outlive the bound.
          set +e
          set -u
          verdict=CLEAN
          done_iters=0
          for i in $(seq 1 "$ITERATIONS"); do
            start=$(date -u +%H:%M:%S)
            # `|| rc=$?` is load-bearing: Actions runs this step under `bash -e`,
            # so a bare `timeout ...` that returns 124 aborts the script before
            # the verdict is printed, and the stall reads as a plain step
            # timeout with no attempt tail. The bound must be able to fire
            # without killing the reporter.
            rc=0
            rm -f /tmp/stall-dump.txt
            # The pre-built binary (see the build step), not `cargo test`: any
            # rebuild inside this bound turns the bound into a lie.
            #
            # Launched in the background under a watchdog rather than under bare
            # `timeout`. A timeout only reports THAT the attempt hung, never
            # WHERE; the 2026-10-06 run produced `STALL_AT_ITERATION_67` and the
            # tail showed four tests wedged together, which is consistent with a
            # process-wide block but cannot distinguish a deadlock from a slow
            # query. The watchdog dumps every thread's kernel stack and state
            # before killing the process, so the next stall names the operation
            # instead of narrowing the suspect list by elimination.
            "$BIN" db_pre_migration_snapshot_test --test-threads=4 > /tmp/iter.log 2>&1 &
            pid=$!
            (
              sleep "$TIMEOUT_SECS"
              if kill -0 "$pid" 2>/dev/null; then
                # gdb attaches to a process it is not the parent of, which
                # ptrace_scope=1 forbids. Best-effort: the /proc tables below
                # still work as root if this fails.
                sudo sysctl -w kernel.yama.ptrace_scope=0 >/dev/null 2>&1 || true
                {
                  echo "=== stall dump: pid $pid at $(date -u +%H:%M:%S) ==="
                  echo "--- gdb: thread apply all bt ---"
                  if command -v gdb >/dev/null 2>&1; then
                    # `tail -250` cut the dump mid-backtrace, so the thread that
                    # HOLDS the contended lock was dropped and the run could not
                    # name it. Keep the whole dump: 7 threads with deep tokio
                    # stacks is ~2k lines, and `info threads` makes the total
                    # count explicit even if the cap is ever hit again.
                    # `bt` names the mutex (the sqlite3.c frames) but not its
                    # HOLDER: on the 2026-10-06 run every visible thread was
                    # waiting on `staticMutexes.112+432` and none of them held
                    # it, so the dump could not say who wedged first. This build
                    # keeps symbols, so ask gdb about the mutex object itself:
                    # glibc's `__data.__owner` is the TID holding it, and
                    # `__data.__kind` distinguishes NORMAL(0) from RECURSIVE(1),
                    # which is what decides cross-thread wait vs same-thread
                    # re-entry. Each -ex stands alone: a failed expression prints
                    # an error and the backtrace still lands.
                    timeout 90 gdb -p "$pid" -batch \
                      -ex 'info threads' \
                      -ex 'thread apply all bt' \
                      -ex 'info variables staticMutexes' \
                      -ex "p (char*)&'staticMutexes.112'" \
                      -ex "p ((pthread_mutex_t*)((char*)&'staticMutexes.112' + 432))->__data.__owner" \
                      -ex "p ((pthread_mutex_t*)((char*)&'staticMutexes.112' + 432))->__data.__kind" \
                      2>&1 | tail -3000
                  else
                    echo "(gdb not on PATH)"
                  fi
                  echo "--- /proc per-thread table ---"
                  for t in /proc/"$pid"/task/*; do
                    echo "## tid=$(basename "$t") comm=$(cat "$t/comm" 2>/dev/null) state=$(awk '/^State:/{print $2}' "$t/status" 2>/dev/null) wchan=$(cat "$t/wchan" 2>/dev/null)"
                    # `wchan` and `syscall` are same-user readable and already say
                    # a lot (futex_wait vs pipe_read vs 0). The kernel stack is
                    # NOT a ptrace read, so it needs CAP_SYS_ADMIN: the step runs
                    # as `runner`, hence sudo. This only executes on a stall.
                    echo "    syscall: $(cat "$t/syscall" 2>/dev/null)"
                    sudo cat "$t/stack" 2>/dev/null | sed 's/^/    /'
                  done
                  # The 2026-10-06 stack dump showed four threads waiting on ONE
                  # static futex address (same 0x55.. value in three blocking
                  # threads and one test thread) with no thread in any file
                  # syscall. Naming that lock needs the executable's load base:
                  # offset = futex_addr - base, then `nm -C "$BIN"` says which
                  # `static Mutex`/`OnceLock` it is. gdb names it directly, but
                  # gdb was absent on that run, so this is the fallback.
                  echo "--- executable mapping (base for static addresses) ---"
                  awk '$6 ~ /opencrabs/ {print; exit}' /proc/"$pid"/maps 2>/dev/null
                  echo "--- open fds ---"
                  ls -l /proc/"$pid"/fd 2>/dev/null | tail -40
                } > /tmp/stall-dump.txt 2>&1
                kill -9 "$pid" 2>/dev/null
              fi
            ) &
            wpid=$!
            wait "$pid"; rc=$?
            kill "$wpid" 2>/dev/null
            wait "$wpid" 2>/dev/null
            done_iters=$i
            if [ "$rc" -eq 0 ]; then
              echo "$start iter $i ok"
              continue
            fi
            echo "$start iter $i rc=$rc <-- NOT OK"
            echo "----- tail of attempt $i -----"
            tail -60 /tmp/iter.log
            if [ -s /tmp/stall-dump.txt ]; then
              echo "----- stall dump (where the threads were stuck) -----"
              cat /tmp/stall-dump.txt
              verdict="STALL"
            elif [ "$rc" -eq 137 ]; then
              verdict="STALL"
            else
              verdict="FAIL"
            fi
            break
          done

          echo "----- verdict -----"
          echo "iterations_completed=$done_iters"
          echo "per_attempt_timeout_secs=$TIMEOUT_SECS"
          if [ "$verdict" = "CLEAN" ]; then
            echo "RESULT=CLEAN_AFTER_${done_iters}_ITERATIONS"
          else
            echo "RESULT=${verdict}_AT_ITERATION_${done_iters}"
          fi

          # A stall is the thing this job exists to find, so it must not read as
          # a green run. A plain failure is also non-green.
          if [ "$verdict" != "CLEAN" ]; then
            exit 1
          fi
