name: Release (fork)

# Why this file exists: release.yml carries `publish-crate`, a live crates.io
# push against the crate name `opencrabs`, and gates `create-release` on that
# publish succeeding. On a fork the publish can never succeed, because the crate
# name belongs to upstream, so `create-release` never runs and the fork
# publishes no tagged release at all. That leaves the updater with nothing to
# find: when this file was written `releases/latest` resolved to
# `win-desktop-preview`, whose tag is not semver, so the version comparison
# never saw anything newer and every check reported "already on latest". The
# latest release is now a real `vX.Y.Z` tag, but it still carries the Linux
# assets only, so a Windows or macOS build finds no asset for its platform at
# all (#151).
#
# This is the fork's own release path. It builds the Linux binaries, names each
# archive exactly as the updater expects
# (`opencrabs-<tag>-<platform>.tar.gz`), writes SHA256SUMS beside them, and
# publishes the release. No crates.io, no upstream.
#
# Linux only, deliberately: linux-arm64 is what the fork's own hosts run (an
# aarch64 set-top box, an x86_64 VPS). macOS and Windows legs stay in
# prerelease.yml for people who build from source; add them here if the fork
# ever needs to auto-update those platforms.
#
# The Android APK rides along since v0.2.0, built by calling android-artifact.yml
# as a reusable workflow. It has to be built HERE rather than lifted from an
# earlier branch run: the release asset must correspond to the tagged commit,
# and a stale APK from some feat branch is an artifact of unknown provenance
# that still carries a valid checksum. It is also the reason the manifest below
# globs *.apk and not just *.tar.gz: an asset that ships without a line in
# SHA256SUMS is published and unchecked, which is worse than absent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.5.5). The tag must already exist."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

env:
  # A tag push carries the tag in ref_name; a manual dispatch carries it in the
  # input, because there ref_name is the branch the workflow ran from.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Guard: the tag and Cargo.toml must agree.
  #
  # The updater compares the release tag against the version the running binary
  # reports, and the binary reports CARGO_PKG_VERSION. A release tagged v0.5.6
  # whose binary says 0.5.5 is an update that can never apply: every host
  # downloads it, swaps it in, restarts, and still reports 0.5.5, so the next
  # check offers the same update again. Fail before spending two build legs.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (tag matches Cargo.toml)
    runs-on: ubuntu-latest
    # `gh run list` reads Actions data, which the workflow-level `contents:
    # write` alone does not cover. Without `actions: read` the gate below
    # cannot see the run it is supposed to check (#2078).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check tag against Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag cargo_version=$cargo_version"
          case "$tag" in
            v*) ;;
            *) echo "::error::tag '$tag' must start with 'v' (e.g. v0.5.5)"; exit 1 ;;
          esac
          if [ "v${cargo_version}" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $cargo_version: bump Cargo.toml first, or tag the commit that has it"
            exit 1
          fi

      # v0.1.0 shipped from a commit whose CI had never been read (#2078). The
      # tag check above only proves the tag matches Cargo.toml; it says nothing
      # about whether that commit is green. ci.yml runs on push to main, so this
      # step reads that run's conclusion and refuses to publish anything else.
      #
      # The SHA comes from `git rev-parse HEAD`, not `github.sha`: this workflow
      # also fires on `workflow_dispatch` with a `tag` input, and there
      # `github.sha` is the branch the dispatch ran from, while the checkout
      # above already resolved the tag. HEAD is the commit actually being built.
      - name: Require a green CI run on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA=$(git rev-parse HEAD)
          REPO="${{ github.repository }}"

          # "No run found" and "run in flight" are handled differently on
          # purpose. ci.yml skips docs-only commits via `paths-ignore`, so a
          # missing run is reachable, and the message below says what to do
          # about it. Either way a missing run FAILS, never skips (#2078).
          if [ "${#SHA}" -ne 40 ]; then
            echo "::error::expected a full 40-character commit SHA, got '${SHA}'."
            exit 1
          fi

          # `gh run list --commit` matches on the full SHA and silently returns
          # nothing for an abbreviated one, which is why the check above exists.
          ci_run() {
            gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" \
              --limit 1 --json status,conclusion,databaseId \
              --jq '.[0] // empty' 2>/dev/null || echo ""
          }

          run=$(ci_run)
          found_deadline=$((SECONDS + 300))
          while [ -z "$run" ]; do
            if [ "$SECONDS" -ge "$found_deadline" ]; then
              echo "::error::no ci.yml run found for $SHA after 5 minutes, so this commit is unverified."
              echo "CI skips docs-only commits (paths-ignore). Either run 'gh workflow run ci.yml --ref main'"
              echo "against a commit CI will actually pick up, or tag a commit CI has already run on. (#2078)"
              exit 1
            fi
            echo "No ci.yml run for $SHA yet; waiting for it to appear..."
            sleep 15
            run=$(ci_run)
          done

          run_deadline=$((SECONDS + 3600))
          while :; do
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion')
            id=$(printf '%s' "$run" | jq -r '.databaseId')
            echo "ci.yml run $id on $SHA: status=$status conclusion=$conclusion"

            # An unreadable status must fail, not read as "still running". This
            # loop is the last thing between a red commit and a published
            # release, so a parse failure has to be loud (#2078).
            if [ -z "$status" ] || [ "$status" = "null" ]; then
              echo "::error::could not read the status of the ci.yml run for $SHA (got '${status}')."
              exit 1
            fi

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green on $SHA. Ready to release."
                exit 0
              fi
              echo "::error::ci.yml run $id on $SHA concluded '$conclusion'. Refusing to publish a red commit (#2078)."
              exit 1
            fi

            if [ "$SECONDS" -ge "$run_deadline" ]; then
              echo "::error::ci.yml run $id on $SHA is still '$status' after 60 minutes. Refusing to publish unverified (#2078)."
              exit 1
            fi

            echo "Waiting for ci.yml run $id to finish (status=$status)..."
            sleep 30
            run=$(ci_run)
            if [ -z "$run" ]; then
              echo "::error::ci.yml run $id for $SHA disappeared while waiting (#2078)."
              exit 1
            fi
          done

  build-linux:
    name: Build ${{ matrix.asset_suffix }}
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    # Profile: `ci`, NOT `release`. `[profile.release]` is lto="fat" with
    # codegen-units=1, and on the ARM runner that fat-LTO link alone runs
    # past the point where GitHub preempts the runner: two consecutive runs
    # died with "The runner has received a shutdown signal" (exit 143) at
    # ~34min, before the archive step ever ran, so no release was published.
    # `[profile.ci]` is release with lto="thin" and codegen-units=16, and
    # linux-artifact.yml builds this same --all-features arm64 target with it
    # in ~18min. Same opt-level (3), same runtime behaviour, a link that
    # finishes inside the runner's window.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --locked --profile ci --target ${{ matrix.target }} --all-features

      - name: Download RTK
        shell: bash
        run: |
          bash scripts/fetch-rtk.sh "${{ matrix.target }}" "target/${{ matrix.target }}/ci"

      - name: Strip
        run: strip target/${{ matrix.target }}/ci/opencrabs

      # Execute it before shipping it. `--version` returns from argument parsing
      # before profile setup and logging init run, so it cannot catch an
      # init-time failure, but it does prove the binary is runnable on the
      # target and carries the expected version.
      - name: Smoke
        shell: bash
        run: |
          set +e
          ver=$(./target/${{ matrix.target }}/ci/opencrabs --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs
          echo "$ver" | grep -q "${RELEASE_TAG#v}"

      # The archive name is a contract, not a label: the updater builds
      # `opencrabs-{tag_name}-{platform_suffix}.tar.gz` from the release's
      # tag_name, which still carries the leading `v`. Rename this and updates
      # break with "no binary found for this platform".
      - name: Create archive
        shell: bash
        run: |
          ARCHIVE="opencrabs-${RELEASE_TAG}-${{ matrix.asset_suffix }}"
          cd "target/${{ matrix.target }}/ci"
          tar czf "../../../${ARCHIVE}.tar.gz" opencrabs rtk
          echo "archive: ${ARCHIVE}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: opencrabs-${{ env.RELEASE_TAG }}-${{ matrix.asset_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Builds the APK at the tag, reusing the shipping workflow rather than
  # duplicating javac/d8/aapt2 here. Nothing is passed in: the reusable workflow
  # checks out the caller's ref, so the APK it produces is the tagged tree.
  android-apk:
    name: Build Android APK
    uses: ./.github/workflows/android-artifact.yml
    # Pass the tag explicitly. A reusable workflow otherwise checks out the
    # caller's ref, which for a workflow_dispatch is the branch, so a manual
    # release would ship an APK from that branch under the tag's filename next
    # to Linux archives built from the tag. Same version, two different trees,
    # and both checksums would verify.
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    # A reusable workflow inherits NO secrets unless the caller passes them,
    # and the signing script falls back to the committed debug key when
    # ANDROID_KEYSTORE_B64 is empty: a silent debug-signed release APK is
    # exactly the artifact Play Protect blocks on the phone with no
    # install-anyway path. Passed by name, not `inherit`: the callee reads only
    # these three, and inherit would hand a build step every secret in the repo
    # (Semgrep rejects it as secrets-inherit).
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    # No continue-on-error here: a reusable workflow call does not accept it
    # (actionlint rejects it), and a silent Android failure would publish a
    # release the publish step then refuses to complete. Failing loudly is the
    # behaviour we want anyway.

  publish-release:
    name: Publish release
    needs: [build-linux, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      # SHA256SUMS is what the updater verifies the download against, and it
      # fails closed: a release without an entry for the asset name is refused
      # outright rather than swapped in unverified. It must be generated here,
      # from the exact bytes being published, and uploaded in the same release.
      - name: Collect and checksum
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
          # The APK arrives as opencrabs-release.apk. Rename it to carry the tag:
          # a user holding two downloaded files has no other way to tell which
          # release each came from, and the manifest lines would collide.
          apk=$(find artifacts -type f -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no .apk in the downloaded artifacts; the android-apk job did not upload one"
            exit 1
          fi
          cp "$apk" "release-assets/opencrabs-${RELEASE_TAG}-android-arm64.apk"
          cd release-assets
          sha256sum -- * > SHA256SUMS
          ls -la
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          # Idempotent: a re-run of the same tag replaces the assets instead of
          # failing on "release already exists".
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists, uploading assets with --clobber"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$tag" \
              --generate-notes
          fi

      # Read back from the API what was actually published. An upload that
      # exits 0 is not proof the assets landed, and this is the same surface the
      # updater reads.
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          echo "--- assets on $tag ---"
          gh release view "$tag" --json assets --jq '.assets[].name' | sort
          # Read the asset list once. `gh ... | grep -qx` would be a pipefail
          # trap: grep exits at the match, gh gets SIGPIPE, and an asset that is
          # published reads as missing.
          PUBLISHED="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for want in "opencrabs-${tag}-linux-arm64.tar.gz" \
                      "opencrabs-${tag}-linux-amd64.tar.gz" \
                      "opencrabs-${tag}-android-arm64.apk" \
                      "SHA256SUMS"; do
            if ! grep -qxF "$want" <<< "$PUBLISHED"; then
              echo "::error::expected asset missing from $tag: $want"
              exit 1
            fi
          done
          echo "all expected assets present"
