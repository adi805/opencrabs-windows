# Machine-readable workflow policy (#1934).
#
# This file is the SOURCE OF TRUTH for the rules a machine can decide.
# `scripts/policy-lint.py` reads it and the `policy-lint` job in
# `.github/workflows/ci.yml` runs that script on every PR. CONTRIBUTING.md and
# AGENTS.md stay the human mirror; when the two disagree, this file and the
# script win, because a gate that is only prose is a gate that gets violated
# and then counted in the ledger.
#
# Scope fence: this covers only what a machine can see without judgement.
# Tone, scope creep, and "is this one problem?" stay in prose review forever.
# Deliberately a short list. A job that is too strict turns legitimate PRs red,
# which trains everyone to ignore it — add a rule only when a real PR would
# have been caught by it.

[commits]
# AGENTS.md (Git Rules): "no `Co-authored-by:` trailers".
# FAIL when any commit in the PR carries the trailer.
no_coauthor_trailers = true

# AGENTS.md (Git Rules): "no AI branding, no 'generated by' tags".
# FAIL when a commit message carries a tool's generation marker. Deliberately
# narrow — it matches generation banners and bot authors, not the words
# "Claude" or "AI" appearing in ordinary prose.
no_ai_branding = true

# Conventional-commit subjects (`type(scope)!: subject`).
# Ships OFF on purpose: merge commits and cross-fork syncs do not follow it,
# so enabling it would fail PRs whose only sin is being merged. Flip to true
# once the repo is uniformly conventional.
conventional_titles = false

[prs]
# WARN (never fail) when a PR's diff touches more than this many files.
# "Is this one problem?" is a judgement call and stays with human review; the
# warning just puts the number in front of the reviewer.
max_files_warn = 30
