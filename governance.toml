# governance.toml: machine-readable source of truth for workflow policy.
#
# Landed by issue #1934. CONTRIBUTING.md and the docs are the human mirror
# of these rules, never the source. Consumed by scripts/policy-lint.py,
# which CI runs in .github/workflows/policy-lint.yml on every PR.
#
# Enforcement map (scope fence: the gate covers only what a machine can
# see; tone and "is this one problem?" stay in human review forever):
#   enforced by policy-lint .... workflow.child_issues_not_child_prs,
#                               commits.no_coauthor_trailers,
#                               commits.conventional_titles,
#                               commits.no_ai_branding,
#                               prs.max_files_warn (warn only)
#   already live elsewhere .... sync_before_commit, single_sanity_ci
#                               (main-protection ruleset + the CI gate)
#   informational for now ..... merge_at_completion (review daemon will
#                               consume it), prs.no_stub
#
# FORK NOTE: this file carries one key upstream's copy does not, and it is
# the reason this file is resolved by hand on every sync. `no_ai_branding`
# enforces AGENTS.md (Git Rules) "no AI branding, no 'generated by' tags"
# on this fork. Upstream's #1934 rewrite dropped the check from
# scripts/policy-lint.py; the key and the check are kept here on purpose.
# The fork's gate is also stricter in placement: see the comment on
# `policy-lint` in .github/workflows/ci.yml.

[workflow]
sync_before_commit = true          # informational; enforcement already lives in the rulesets
child_issues_not_child_prs = true  # enforced by policy-lint
one_pr_per_problem = true          # soft: diff-size warn
single_sanity_ci = true            # informational; already the CI gate
merge_at_completion = true         # consumed by the review daemon

[prs]
max_files_warn = 30
no_stub = true

[commits]
no_coauthor_trailers = true
conventional_titles = true

# FORK-ONLY. AGENTS.md (Git Rules): "no AI branding, no 'generated by' tags".
# FAIL when a commit message carries a tool's generation marker. Deliberately
# narrow: it matches generation banners and bot authors, not the words
# "Claude" or "AI" appearing in ordinary prose.
no_ai_branding = true
